name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile release variants and warm Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile lite and full release variants
        run: |
          ./gradlew --no-daemon \
            :app:compileLiteReleaseKotlin \
            :app:compileFullReleaseKotlin \
            :app:mergeLiteReleaseNativeLibs \
            :app:mergeFullReleaseNativeLibs
