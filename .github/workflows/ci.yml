name: Orbit CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Build Vision and Wear
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test shared code and build Vision
        run: |
          ./gradlew --no-daemon \
            :core:jvmTest \
            :core:testAndroidHostTest \
            :vision:desktopTest \
            :vision:testAndroidHostTest \
            :vision:compileAndroidDeviceTest \
            :vision-android:assembleDebug \
            :vision-android:lintDebug

      - name: Launch Vision Desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          timeout 120s xvfb-run -a ./gradlew --no-daemon :vision:run --args=--smoke-test

      - name: Compile lite and full release variants
        run: |
          ./gradlew --no-daemon \
            :wear:compileLiteReleaseKotlin \
            :wear:compileFullReleaseKotlin \
            :wear:mergeLiteReleaseNativeLibs \
            :wear:mergeFullReleaseNativeLibs
